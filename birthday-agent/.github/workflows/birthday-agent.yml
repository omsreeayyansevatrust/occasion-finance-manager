name: Birthday Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"
      timezone: "Asia/Kolkata"

jobs:
  birthday-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Birthday Agent dependencies
        working-directory: birthday-agent
        run: npm ci

      - name: Run Birthday Agent
        working-directory: birthday-agent
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm start